name: Mezbaan Restro CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_NO_TELEMETRY: "1"

jobs:
  detect:
    name: Detect App Directory
    runs-on: ubuntu-latest
    outputs:
      app-dir: ${{ steps.detect.outputs.app-dir }}
      pm: ${{ steps.detect.outputs.pm }}
      lockfile: ${{ steps.detect.outputs.lockfile }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect Expo app directory and package manager
        id: detect
        run: |
          # Search for the Expo app in common monorepo locations
          APP_DIR="."
          if [ -f frontend/package.json ]; then
            APP_DIR="frontend"
          elif [ -f app/package.json ]; then
            APP_DIR="app"
          fi
          echo "app-dir=$APP_DIR" >> "$GITHUB_OUTPUT"

          # Detect package manager from lockfile
          if [ -f "$APP_DIR/yarn.lock" ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "lockfile=$APP_DIR/yarn.lock" >> "$GITHUB_OUTPUT"
          elif [ -f "$APP_DIR/package-lock.json" ]; then
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "lockfile=$APP_DIR/package-lock.json" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "lockfile=$APP_DIR/package-lock.json" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Type Check & Lint
    runs-on: ubuntu-latest
    needs: detect
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ needs.detect.outputs.pm }}
          cache-dependency-path: ${{ needs.detect.outputs.lockfile }}

      - name: Install dependencies
        working-directory: ${{ needs.detect.outputs.app-dir }}
        run: ${{ needs.detect.outputs.pm == 'yarn' && 'yarn install --frozen-lockfile' || 'npm ci' }}

      - name: TypeScript check
        working-directory: ${{ needs.detect.outputs.app-dir }}
        run: npx tsc --noEmit

      - name: Lint
        working-directory: ${{ needs.detect.outputs.app-dir }}
        run: npx expo lint --max-warnings 0 || true

  web-build:
    name: Web Build
    runs-on: ubuntu-latest
    needs: [detect, quality]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ needs.detect.outputs.pm }}
          cache-dependency-path: ${{ needs.detect.outputs.lockfile }}

      - name: Install dependencies
        working-directory: ${{ needs.detect.outputs.app-dir }}
        run: ${{ needs.detect.outputs.pm == 'yarn' && 'yarn install --frozen-lockfile' || 'npm ci' }}

      - name: Expo web export
        working-directory: ${{ needs.detect.outputs.app-dir }}
        run: npx expo export --platform web
        env:
          METRO_CACHE_ROOT: /tmp/metro-cache

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: ${{ needs.detect.outputs.app-dir }}/dist
          retention-days: 14

  android-build:
    name: Android Debug APK & Release AAB
    runs-on: ubuntu-latest
    needs: [detect, quality]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ needs.detect.outputs.pm }}
          cache-dependency-path: ${{ needs.detect.outputs.lockfile }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install dependencies
        working-directory: ${{ needs.detect.outputs.app-dir }}
        run: ${{ needs.detect.outputs.pm == 'yarn' && 'yarn install --frozen-lockfile' || 'npm ci' }}

      - name: Ensure splash icon asset exists
        working-directory: ${{ needs.detect.outputs.app-dir }}
        run: |
          if [ ! -f assets/images/splash-icon.png ] && [ -f assets/images/splash-image.png ]; then
            cp assets/images/splash-image.png assets/images/splash-icon.png
          fi

      - name: Expo Android prebuild
        working-directory: ${{ needs.detect.outputs.app-dir }}
        run: npx expo prebuild --platform android --no-install
        env:
          METRO_CACHE_ROOT: /tmp/metro-cache

      - name: Build debug APK
        working-directory: ${{ needs.detect.outputs.app-dir }}/android
        run: ./gradlew assembleDebug

      - name: Build release AAB
        working-directory: ${{ needs.detect.outputs.app-dir }}/android
        run: ./gradlew bundleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: ${{ needs.detect.outputs.app-dir }}/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: ${{ needs.detect.outputs.app-dir }}/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
